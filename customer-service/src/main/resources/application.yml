server:
  port: 7171

spring:
  application:
    name: CUSTOMER-SERVICE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/GaneshFSD_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    jersey:
      enabled: false       
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost